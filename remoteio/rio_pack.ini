; rio_pack.ini —— 多虚拟文件 → 单远程大文件 映射配置
; 环境变量 RIO_PACK_CONFIG 指向此文件则启用 pack 模式

[pack]
prefix    = /virtual
pack_file = /remote/pack.bin

; ---------- 虚拟文件段 ----------
; 每个虚拟文件映射到 pack_file 里的一段连续区域

[/virtual/config.txt]
offset = 0
size   = 64

[/virtual/header.bin]
offset = 64
size   = 128

[/virtual/records.log]
offset = 192
size   = 256
